name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      # Fails if package.json and package-lock.json disagree: the two must move together.
      - name: Check lockfile
        run: npm ci --dry-run

      - name: Install dependencies
        run: npm ci

      - name: Types and syntax
        run: npm run check

      - name: Test
        run: npm test

      - name: Dead code
        run: npm run knip
