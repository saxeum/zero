name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      # Fails if package.json and package-lock.json disagree: the two must move together.
      - name: Check lockfile
        run: npm ci --dry-run

      - name: Install dependencies
        run: npm ci

      - name: Types and syntax
        run: npm run check

      - name: Test
        run: npm test

      - name: Dead code
        run: npm run knip
