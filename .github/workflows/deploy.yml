name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A second merge queues rather than racing the first into
# production; cancel-in-progress would leave the Worker half-updated.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      # Fails clearly here rather than as a confusing wrangler auth error below.
      - name: Check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }

      - name: Install dependencies
        run: npm ci

      # Nothing reaches production unless the same six gates passed locally.
      - name: Verify
        run: npm run verify

      # Migrations before the Worker: the old code tolerates an additive schema, the
      # new code does not tolerate a missing one. This only holds while migrations are
      # additive (expand, then contract in a later deploy) — destructive changes need
      # two deploys, not one.
      - name: Apply D1 migrations
        run: npm run migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # The only check that ever sees production. It creates one item and deletes it
      # again. A failure here marks the run red but does not roll back — production is
      # already updated by this point, which is worth knowing before trusting red/green.
      - name: Smoke test the deployment
        run: npm run smoke -- https://zero.foonix.net
