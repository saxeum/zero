openapi: 3.1.0

info:
  title: zero
  version: 1.0.0
  description: |
    Todo list API.

    This file is the source of truth. `shared/generated/` is produced from it by `npm run codegen`,
    and `npm run verify` fails if the two disagree. Edit the spec, regenerate, then write code
    against the output — never the other way round.

servers:
  - url: http://localhost:3000

paths:
  /api/items:
    get:
      operationId: listItems
      summary: List every item, in insertion order
      responses:
        "200":
          description: The full list
          headers:
            Cache-Control:
              description: Always no-store; the list is read from SQLite per request
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

    post:
      operationId: createItem
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItem"
      responses:
        "201":
          description: The item as stored, including its server-generated id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Blank text, a wrong type, an unknown field, or malformed JSON
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: No valid session cookie
          content:
            text/plain:
              schema:
                type: string

  /api/items/{id}:
    delete:
      operationId: deleteItem
      summary: Delete an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: No valid session cookie
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No item with that id
          content:
            text/plain:
              schema:
                type: string

  /api/session:
    get:
      operationId: getSession
      summary: The signed-in user, if any
      responses:
        "200":
          description: The current session's user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: No valid session cookie
          content:
            text/plain:
              schema:
                type: string

    post:
      operationId: createSession
      summary: Exchange a Google ID token for a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSession"
      responses:
        "200":
          description: Signed in; the session cookie is set on this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed body
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: The ID token did not verify
          content:
            text/plain:
              schema:
                type: string

    delete:
      operationId: deleteSession
      summary: Sign out, clearing the cookie
      responses:
        "204":
          description: Signed out

components:
  schemas:
    Session:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: For display only. Identity is the token's subject, never the email.

    NewSession:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          maxLength: 4096
          description: The Google ID token (JWT) from Google Identity Services

    Item:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          description: Assigned by the server
        text:
          type: string

    NewItem:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          # The cap is on the raw field, before trimming: it exists to bound the body and
          # the stored row, not to police whitespace. It applies to writes only — Item.text
          # is deliberately uncapped so existing rows stay readable.
          maxLength: 1000
          description: Trimmed; must not be blank; at most 1000 characters
